<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1FE07B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#071810" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
  </defs>
  <!-- Fondo con resplandor neón -->
  <rect width="512" height="512" fill="url(#neonGlow)"/>
  
  <!-- Círculo interior abstracto (Balón) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1FE07B" stroke-width="12" stroke-dasharray="40 15 10 15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#E8A33D" stroke-width="6" opacity="0.6"/>
  
  <!-- Letras F5 y F7 entrelazadas -->
  <text x="256" y="240" font-family="'Oswald', sans-serif" font-weight="bold" font-size="110" fill="url(#goldText)" text-anchor="middle" letter-spacing="-5">F5·F7</text>
  <text x="256" y="315" font-family="-apple-system, sans-serif" font-weight="600" font-size="38" fill="#CFE0D6" text-anchor="middle" letter-spacing="8">CUENTAS</text>
</svg>
