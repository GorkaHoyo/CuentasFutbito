<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Brillo MUCHO más sutil y oscuro para no comerse el texto -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#154934" stop-opacity="1"/>
      <stop offset="100%" stop-color="#071810" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo sólido con resplandor leve -->
  <rect width="512" height="512" fill="url(#neonGlow)"/>
  
  <!-- Círculo exterior abstracto (Más grueso y definido) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2D8659" stroke-width="16" stroke-dasharray="60 20 15 20"/>
  
  <!-- Letras F5 y F7 entrelazadas -->
  <text x="256" y="250" font-family="'Oswald', -apple-system, sans-serif" font-weight="bold" font-size="120" fill="url(#goldText)" text-anchor="middle" letter-spacing="-2">F5·F7</text>
  
  <!-- CUENTAS más grande, dorado y separado -->
  <text x="256" y="325" font-family="-apple-system, sans-serif" font-weight="bold" font-size="45" fill="#E8A33D" text-anchor="middle" letter-spacing="10">CUENTAS</text>
</svg>
